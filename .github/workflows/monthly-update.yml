name: Monthly FAA snapshot

on:
  schedule:
    - cron: "23 14 17 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: monthly-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Pull tracker
        id: pull
        run: |
          set +e
          python scripts/update_faa.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" != "1" ]

      - name: Check before commit
        if: steps.pull.outputs.code == '0'
        run: |
          python scripts/validate_data.py
          python scripts/check_render.py

      - name: Commit snapshot
        if: steps.pull.outputs.code == '0'
        run: |
          as_of=$(python -c "import json; print(json.load(open('data/faa_snapshots.json'))['snapshots'][-1]['asOf'])")
          git config user.name "faa-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/faa_snapshots.json
          git commit -m "Snapshot: FAA tracker as of $as_of"
          git push

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Monthly FAA snapshot failed ($(date -u +%Y-%m-%d))" \
            --body "The snapshot job failed. Likely causes: the tracker changed its bundle layout, bot protection blocked the runner, or the new data broke validation or rendering. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
